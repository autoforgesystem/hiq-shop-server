# Render Blueprint for the HIQ Shop API and its Postgres database.
# In Render: New > Blueprint > pick this repository and the deploy/render branch.
# Spec: https://render.com/docs/blueprint-spec
databases:
  - name: hiq-shop-db
    databaseName: hiq_shop
    user: hiq
    plan: free
    region: singapore

services:
  - type: web
    name: hiq-shop-api
    runtime: node
    plan: free
    region: singapore
    branch: deploy/render
    buildCommand: npm run render:build
    # Applies new migrations, then seeds. The seed skips anything already there, so it is safe on every start.
    startCommand: npm run render:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hiq-shop-db
          property: connectionString
      - key: DB_POOL_MAX
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      # Render sits in front of the app; this lets rate limits see each visitor's real IP.
      - key: TRUST_PROXY
        value: "1"
      # The front-end's address, e.g. https://hiq-shop.onrender.com (Render asks for it when you create the Blueprint)
      - key: CORS_ORIGINS
        sync: false
      # First admin account, created by the seed on the first start
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Demo customers (juan@example.com / demo1234). Keep false for a real launch.
      - key: SEED_DEMO
        value: "false"
      - key: SUBSCRIPTIONS_ENABLED
        value: "false"
      - key: SERVICE_AREAS
        sync: false
